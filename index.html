<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Someone Special ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffe6f0, #f5e6ff);
      overflow-x: hidden;
      color: #333;
    }

    section {
      padding: 80px 10%;
    }

    /* HERO */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .hero h1 {
      font-size: 70px;
      background: linear-gradient(to right, #ff4d88, #b300ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glow 2s infinite alternate;
    }

    .hero p {
      margin-top: 20px;
      font-size: 24px;
      max-width: 700px;
      line-height: 1.7;
    }

    .btn {
      margin-top: 35px;
      padding: 15px 35px;
      background: #ff4d88;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.4s;
      animation: pulse 2s infinite;
    }

    .btn:hover {
      transform: scale(1.1);
      background: #e6005c;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #ff99cc; }
      to { text-shadow: 0 0 25px #ff1a75; }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    html {
      scroll-behavior: smooth;
    }

    /* MUSIC BUTTON */
    #musicBtn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 2000;
      padding: 14px 24px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(45deg,#ff4d88,#ff66b3);
      color: white;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255,77,136,0.4);
      transition: 0.3s;
    }

    #musicBtn:hover {
      transform: scale(1.1);
    }

    /* FLOATING HEARTS */
    .floating-heart {
      position: fixed;
      bottom: -20px;
      color: rgba(255, 0, 102, 0.7);
      animation: rise linear forwards;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes rise {
      0% {
        transform: translateY(0) scale(0.5);
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh) scale(1.5);
        opacity: 0;
      }
    }

    /* GALLERY */
    .gallery h2,
    .quotes h2,
    .videos h2,
    .final h2 {
      text-align: center;
      font-size: 50px;
      margin-bottom: 50px;
      color: #ff3385;
    }

    .gallery-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
    }

    .gallery-container img {
      width: 100%;
      height: 400px;
      object-fit: cover;
      border-radius: 25px;
    }

    .video-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 30px;
    }

    video {
      width: 100%;
      border-radius: 25px;
    }

    .final-box {
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(10px);
      padding: 60px;
      border-radius: 40px;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    @media(max-width:768px){
      .hero h1{font-size:40px;}
      .hero p{font-size:18px;}
      .gallery h2{font-size:35px;}
    }
  </style>
</head>

<body>

<!-- MUSIC -->
<audio id="bgMusic" loop>
  <source src="WhatsApp Audio 2026-05-27 at 11.27.51 PM.mpeg" type="audio/mp3">
</audio>

<button id="musicBtn">🎵 Play Music</button>

<!-- HERO -->
<section class="hero">
  <h1>Made with love for Anshu ❤️</h1>
  <p>A digital world filled with memories, smiles and love.</p>
  <button class="btn">Explore Memories ✨</button>
</section>

<!-- GALLERY -->
<section class="gallery">
  <h2>Beautiful Memories 📸</h2>
  <div class="gallery-container">
    <img src="IMG_2566.JPG.jpeg">
    <img src="IMG_2567.JPG.jpeg">
    <img src="IMG_2568.JPG.jpeg">
    <img src="IMG_2569.JPG.jpeg">
  </div>
</section>

<!-- QUOTES -->
<section class="quotes">
  <h2>Sweet Words 💌</h2>
</section>

<!-- VIDEOS -->
<section class="videos">
  <h2>Video Moments 🎥</h2>
  <div class="video-container">
    <video controls src="IMG_2563.MP4"></video>
    <video controls src="IMG_2564.MP4"></video>
  </div>
</section>

<!-- FINAL -->
<section class="final">
  <div class="final-box">
    <h2>A Little Surprise 🌸</h2>
    <p>You make every moment brighter and more beautiful.</p>
    <button class="btn">Stay Amazing ✨</button>
  </div>
</section>

<footer>Made with ❤️ and creativity.</footer>

<script>
  // MUSIC TOGGLE
  const music = document.getElementById("bgMusic");
  const btn = document.getElementById("musicBtn");

  btn.addEventListener("click", () => {
    if (music.paused) {
      music.play();
      btn.innerHTML = "⏸ Pause Music";
    } else {
      music.pause();
      btn.innerHTML = "🎵 Play Music";
    }
  });

  // FLOATING HEARTS
  function createHeart() {
    const heart = document.createElement("div");
    heart.className = "floating-heart";
    heart.innerHTML = ["❤️","💖","💕","💘","💝"][Math.floor(Math.random()*5)];

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (20 + Math.random()*20) + "px";
    heart.style.animationDuration = (4 + Math.random()*3) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 7000);
  }

  setInterval(createHeart, 300);

  // SCROLL BUTTON
  document.querySelector(".btn").addEventListener("click", () => {
    document.querySelector(".gallery").scrollIntoView({ behavior: "smooth" });
  });
</script>

</body>
</html>
